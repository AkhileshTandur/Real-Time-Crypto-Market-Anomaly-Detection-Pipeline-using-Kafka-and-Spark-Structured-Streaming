<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Market Anomaly Dashboard</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #fff;
      --ink: #17202a;
      --muted: #64748b;
      --line: #d7dde5;
      --blue: #2563eb;
      --green: #12805c;
      --red: #c02626;
      --shadow: 0 8px 28px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      padding: 20px 28px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, a.button {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      padding: 0 14px;
      font-weight: 650;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    button.primary {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
    }

    main {
      padding: 24px;
      display: grid;
      gap: 20px;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(140px, 1fr));
      gap: 14px;
    }

    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .metric {
      padding: 16px;
      min-height: 96px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .metric strong {
      display: block;
      margin-top: 10px;
      font-size: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      padding: 18px;
      min-width: 0;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 16px;
    }

    canvas {
      width: 100%;
      height: 300px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 8px;
      text-align: left;
      white-space: nowrap;
    }

    th {
      color: var(--muted);
      background: #fafbfc;
    }

    .table-wrap {
      max-height: 320px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .status {
      border-radius: 999px;
      padding: 3px 8px;
      font-weight: 700;
      background: #fff1f1;
      color: var(--red);
      font-size: 12px;
    }

    .notice {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #fff;
      display: none;
    }

    @media (max-width: 1000px) {
      header { align-items: flex-start; flex-direction: column; }
      .metrics, .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Crypto Market Anomaly Dashboard</h1>
    <div class="actions">
      <button class="primary" id="reloadBtn">Reload Data</button>
      <a class="button" href="http://localhost:8080" target="_blank" rel="noreferrer">Kafka UI</a>
      <a class="button" href="http://localhost:4040" target="_blank" rel="noreferrer">Spark UI</a>
    </div>
  </header>

  <main>
    <div class="notice" id="notice"></div>

    <section class="metrics">
      <div class="metric"><span>Total Records</span><strong id="totalRecords">0</strong></div>
      <div class="metric"><span>Symbols</span><strong id="symbols">-</strong></div>
      <div class="metric"><span>Time Range</span><strong id="timeRange">-</strong></div>
      <div class="metric"><span>Avg Trade Value</span><strong id="avgTradeValue">0</strong></div>
      <div class="metric"><span>Anomalies</span><strong id="anomalyCount">0</strong></div>
      <div class="metric"><span>ML Anomalies</span><strong id="mlAnomalyCount">0</strong></div>
    </section>

    <section class="grid">
      <article class="panel">
        <h2>Price Over Time</h2>
        <canvas id="priceChart" width="1000" height="360"></canvas>
      </article>

      <article class="panel">
        <h2>Symbol Aggregates</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Symbol</th>
                <th>Avg Price</th>
                <th>Volume</th>
                <th>Trades</th>
                <th>Max Trade Value</th>
              </tr>
            </thead>
            <tbody id="aggregateRows"></tbody>
          </table>
        </div>
      </article>
    </section>

    <section class="panel">
      <h2>Anomaly History</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Detected At</th>
              <th>Symbol</th>
              <th>Price</th>
              <th>Quantity</th>
              <th>Trade Value</th>
              <th>Price Z</th>
              <th>Value Z</th>
              <th>Reason</th>
            </tr>
          </thead>
          <tbody id="anomalyRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const chart = document.getElementById("priceChart");
    const ctx = chart.getContext("2d");
    const notice = document.getElementById("notice");

    const money = value => Number(value || 0).toLocaleString(undefined, {
      maximumFractionDigits: 2
    });

    function showNotice(message) {
      notice.textContent = message;
      notice.style.display = "block";
    }

    function hideNotice() {
      notice.style.display = "none";
    }

    async function loadData() {
      try {
        const response = await fetch("data/dashboard_data.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`dashboard_data.json returned ${response.status}`);
        const data = await response.json();
        hideNotice();
        render(data);
      } catch (error) {
        showNotice("Dashboard data is not available. Run: py dashboard\\build_dashboard_data.py");
      }
    }

    function render(data) {
      renderSummary(data.summary || {});
      renderAggregates(data.aggregates || []);
      renderAnomalies(data.anomalies || []);
      drawPriceChart(data.price_series || []);
    }

    function renderSummary(summary) {
      document.getElementById("totalRecords").textContent = money(summary.total_records);
      document.getElementById("symbols").textContent = (summary.symbols || []).join(", ") || "-";
      document.getElementById("avgTradeValue").textContent = money(summary.avg_trade_value);
      document.getElementById("anomalyCount").textContent = money(summary.anomaly_count);
      document.getElementById("mlAnomalyCount").textContent = money(summary.ml_anomaly_count);

      if (summary.time_start && summary.time_end) {
        const start = new Date(summary.time_start).toLocaleTimeString();
        const end = new Date(summary.time_end).toLocaleTimeString();
        document.getElementById("timeRange").textContent = `${start} - ${end}`;
      } else {
        document.getElementById("timeRange").textContent = "-";
      }
    }

    function renderAggregates(rows) {
      document.getElementById("aggregateRows").innerHTML = rows.map(row => `
        <tr>
          <td>${row.symbol}</td>
          <td>${money(row.avg_price)}</td>
          <td>${money(row.volume)}</td>
          <td>${money(row.trade_count)}</td>
          <td>${money(row.max_trade_value)}</td>
        </tr>
      `).join("");
    }

    function renderAnomalies(rows) {
      document.getElementById("anomalyRows").innerHTML = rows.length ? rows.map(row => `
        <tr>
          <td>${row.detected_at ? new Date(row.detected_at).toLocaleString() : "-"}</td>
          <td>${row.symbol}</td>
          <td>${money(row.price)}</td>
          <td>${money(row.quantity)}</td>
          <td>${money(row.trade_value)}</td>
          <td>${Number(row.price_zscore).toFixed(2)}</td>
          <td>${Number(row.trade_value_zscore).toFixed(2)}</td>
          <td><span class="status">${row.reason}</span></td>
        </tr>
      `).join("") : `
        <tr><td colspan="8">No anomalies found in the latest anomaly score file.</td></tr>
      `;
    }

    function drawPriceChart(points) {
      ctx.clearRect(0, 0, chart.width, chart.height);
      ctx.strokeStyle = "#d7dde5";
      ctx.lineWidth = 1;
      for (let y = 40; y < chart.height - 20; y += 55) {
        ctx.beginPath();
        ctx.moveTo(48, y);
        ctx.lineTo(chart.width - 20, y);
        ctx.stroke();
      }

      const symbols = [...new Set(points.map(point => point.symbol))];
      const colors = ["#2563eb", "#12805c", "#c02626", "#7c3aed"];
      symbols.forEach((symbol, index) => {
        const series = points.filter(point => point.symbol === symbol);
        drawSeries(series, colors[index % colors.length]);
      });
    }

    function drawSeries(series, color) {
      if (series.length < 2) return;
      const prices = series.map(point => point.price);
      const min = Math.min(...prices);
      const max = Math.max(...prices);
      const pad = Math.max((max - min) * 0.1, 1);
      const lo = min - pad;
      const hi = max + pad;

      ctx.strokeStyle = color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();

      series.forEach((point, index) => {
        const x = 48 + index * ((chart.width - 80) / Math.max(series.length - 1, 1));
        const y = chart.height - 32 - ((point.price - lo) / (hi - lo)) * (chart.height - 70);
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });

      ctx.stroke();
    }

    document.getElementById("reloadBtn").addEventListener("click", loadData);
    loadData();
  </script>
</body>
</html>
