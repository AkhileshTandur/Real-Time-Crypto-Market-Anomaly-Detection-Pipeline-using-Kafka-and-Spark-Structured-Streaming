services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: crypto-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/tmp/kraft-combined-logs

  kafka-ui:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: crypto-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:29092

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: crypto-kafka-init
    depends_on:
      - kafka
    command:
      - /bin/bash
      - -lc
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic crypto.trades --partitions 1 --replication-factor 1

  spark-streaming:
    image: apache/spark:3.5.0
    container_name: crypto-spark-streaming
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "4040:4040"
    working_dir: /app
    user: root
    volumes:
      - ./:/app
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0
      - streaming/spark_stream_kafka_crypto_clean_aggregate.py
      - --bootstrap_servers
      - kafka:29092
      - --topic
      - crypto.trades
      - --out_path
      - data/stream/aggregates_csv
      - --checkpoint_path
      - data/stream/checkpoints/agg
      - --window_seconds
      - "60"
      - --watermark_seconds
      - "120"
      - --sink
      - console

volumes:
  kafka_data:
